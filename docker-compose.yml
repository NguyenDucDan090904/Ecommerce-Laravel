version: '3.8'

services:
    # 1. Ứng dụng Laravel (PHP-FPM)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ecom-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - laravel-net
        depends_on:
            - db
            - redis

    # 2. Web Server (Nginx)
    nginx:
        image: nginx:alpine
        container_name: ecom-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel-net
        depends_on:
            - app

    # 3. Cơ sở dữ liệu (MySQL 8.0)
    db:
        image: mysql:8.0
        container_name: ecom-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_ecom
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: password123
        ports:
            - "3310:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel-net

    # 4. Redis (Dùng cho Cache & Queue)
    redis:
        image: redis:alpine
        container_name: ecom-redis
        restart: unless-stopped
        networks:
            - laravel-net

    # 5. Queue Worker (Xử lý tác vụ ngầm: Gửi mail, Webhook)
    worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ecom-worker
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --verbose --tries=3 --timeout=90
        volumes:
            - .:/var/www/html
        networks:
            - laravel-net
        depends_on:
            - db
            - redis

    # 6. Scheduler (Tự động chạy task: Hủy đơn quá hạn, Báo cáo)
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ecom-scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        command: sh -c "while [ true ]; do php artisan schedule:run --no-interaction & sleep 60; done"
        volumes:
            - .:/var/www/html
        networks:
            - laravel-net
        depends_on:
            - db
            - redis

    # 7. Quản lý DB (phpMyAdmin)
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: ecom-phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_USER: laravel_user
            PMA_PASSWORD: password123
        networks:
            - laravel-net

networks:
    laravel-net:
        driver: bridge

volumes:
    dbdata:
